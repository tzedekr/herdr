onboarding = false

[keys]
prefix = "ctrl+b"
new_tab = ["prefix+c", "cmd+t"]
close_tab = ["prefix+shift+x", "cmd+w"]
goto = ["prefix+g", "cmd+k"]
previous_tab = ["prefix+p", "ctrl+left"]
next_tab = ["prefix+n", "ctrl+right"]
previous_workspace = "ctrl+up"
next_workspace = "ctrl+down"
cycle_pane_next = ["prefix+tab", "alt+up"]
cycle_pane_previous = ["prefix+shift+tab", "alt+down"]
# Preserve the verified guard against accidental pane/workspace deletion.
close_pane = ""
# prefix+e / prefix+o are claimed by herdr-nvim below.
edit_scrollback = "prefix+shift+e"
open_notification_target = "prefix+shift+o"

# Open lazygit over the focused pane. Press q to close it.
[[keys.command]]
key = ["cmd+shift+g", "prefix+d"]
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec lazygit"
description = "Git status"
width = "90%"
height = "85%"

# Full-height nvim sidebar. Toggle restores the original pane layout.
[[keys.command]]
key = ["prefix+e", "cmd+shift+e"]
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

# Fuzzy-open files the agent touched this session, or type to search the repo.
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[ui]
agent_selection_style = "outline"

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/colecarden/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 2, timeout_seconds = 3 },
]
# <<< herdr-radar tab-bar block

agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "dots"
copy_on_select = false

[ui.sound]
enabled = false

# Personal selection fill for the light sidebar; Radar preserves this user-owned table.
[theme.custom]
active_row_bg = "#b9cdf2"

